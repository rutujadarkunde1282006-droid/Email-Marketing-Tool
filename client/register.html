<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Email Marketing Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           REGISTER PAGE — DARK
        ========================================== */
        * {
            box-sizing: border-box;
        }
        .register-page {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(245, 166, 35, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(124, 143, 255, 0.10),
                    transparent 35%
                ),
                #0A0E1A;
        }
        .register-wrapper {
            width: 100%;
            max-width: 430px;
        }
        /* ==========================================
           BRAND
        ========================================== */
        .register-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #171D33;
            border: 1px solid #262D45;
            color: #F5A623;
            font-size: 27px;
            font-weight: 700;
        }
        .register-brand h1 {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            color: #F4F6FB;
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .register-brand p {
            margin: 8px 0 0;
            color: #8D96AE;
            font-size: 14px;
        }
        /* ==========================================
           REGISTER CARD
        ========================================== */
        .register-card {
            background: #12172A;
            border: 1px solid #262D45;
            border-radius: 18px;
            padding: 34px;
        }
        .register-card h2 {
            margin: 0 0 6px;
            font-family: "Space Grotesk", sans-serif;
            color: #F4F6FB;
            font-size: 21px;
            font-weight: 600;
        }
        .register-subtitle {
            margin: 0 0 26px;
            color: #8D96AE;
            font-size: 14px;
        }
        /* ==========================================
           FORM
        ========================================== */
        .register-form-group {
            margin-bottom: 19px;
        }
        .register-form-group label {
            display: block;
            margin-bottom: 8px;
            color: #C7CEDE;
            font-size: 14px;
            font-weight: 600;
        }
        .input-wrapper {
            position: relative;
        }
        .register-input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            box-sizing: border-box;
            border: 1px solid #262D45;
            border-radius: 10px;
            background: #0D1220;
            color: #EDF0F7;
            font-size: 15px;
            outline: none;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }
        .register-input::placeholder {
            color: #5C637A;
        }
        .register-input:focus {
            border-color: #F5A623;
            background: #171D33;
            box-shadow:
                0 0 0 3px rgba(245, 166, 35, 0.14);
        }
        .password-input {
            padding-right: 70px;
        }
        /* ==========================================
           PASSWORD TOGGLE
        ========================================== */
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #F5A623;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 5px;
        }
        .password-toggle:hover {
            color: #FFB847;
        }
        /* ==========================================
           PASSWORD HINT
        ========================================== */
        .password-hint {
            margin: 7px 0 0;
            color: #5C637A;
            font-size: 12px;
            line-height: 1.5;
        }
        /* ==========================================
           REGISTER BUTTON
        ========================================== */
        .register-button {
            width: 100%;
            height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            background: #F5A623;
            color: #0A0E1A;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                opacity 0.2s ease;
        }
        .register-button:hover {
            background: #FFB847;
            transform: translateY(-1px);
        }
        .register-button:active {
            transform: translateY(0);
        }
        .register-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }
        /* ==========================================
           MESSAGE
        ========================================== */
        #message {
            min-height: 20px;
            margin: 16px 0 0;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        #message.success {
            color: #34D399;
        }
        #message.error {
            color: #F87171;
        }
        /* ==========================================
           LOGIN LINK
        ========================================== */
        .login-text {
            margin: 24px 0 0;
            text-align: center;
            color: #8D96AE;
            font-size: 14px;
        }
        .login-text a {
            color: #F5A623;
            font-weight: 700;
            text-decoration: none;
        }
        .login-text a:hover {
            text-decoration: underline;
        }
        /* ==========================================
           FOOTER
        ========================================== */
        .register-footer {
            margin-top: 20px;
            text-align: center;
            color: #5C637A;
            font-size: 12px;
        }
        /* ==========================================
           MOBILE
        ========================================== */
        @media (max-width: 480px) {
            .register-page {
                padding: 18px;
            }
            .register-card {
                padding: 26px 20px;
                border-radius: 15px;
            }
            .register-brand h1 {
                font-size: 23px;
            }
            .brand-icon {
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body class="register-page">
    <main class="register-wrapper">
        <!-- BRAND -->
        <div class="register-brand">
            <div class="brand-icon" aria-hidden="true">
                ✉
            </div>
            <h1>Email Marketing Tool</h1>
            <p>Create your account and start managing campaigns.</p>
        </div>
        <!-- REGISTER CARD -->
        <section class="register-card">
            <h2>Create your account</h2>
            <p class="register-subtitle">Sign up to get started with your email campaigns.</p>
            <form
                id="registerForm"
                autocomplete="on"
            >
                <!-- NAME -->
                <div class="register-form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="register-input"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>
                <!-- EMAIL -->
                <div class="register-form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="register-input"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >
                </div>
                <!-- PASSWORD -->
                <div class="register-form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="register-input password-input"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                            minlength="6"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                    <p class="password-hint">
                        Use at least 6 characters for your password.
                    </p>
                </div>
                <!-- CONFIRM PASSWORD -->
                <div class="register-form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="register-input password-input"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                            minlength="6"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmPasswordToggle"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>
                <!-- REGISTER BUTTON -->
                <button
                    type="submit"
                    class="register-button"
                >Create Account</button>
            </form>
            <!-- MESSAGE -->
            <p
                id="message"
                role="alert"
                aria-live="polite"
            ></p>
            <!-- LOGIN LINK -->
            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </section>
        <div class="register-footer">
            Secure campaign management made simple.
        </div>
    </main>
    <script src="js/register.js"></script>
    <script>
        // ==========================================
        // PASSWORD TOGGLE
        // ==========================================
        function setupPasswordToggle(
            inputId,
            buttonId
        ) {
            const input =
                document.getElementById(inputId);
            const button =
                document.getElementById(buttonId);
            if (!input || !button) {
                return;
            }
            button.addEventListener(
                "click",
                function () {
                    const isPassword =
                        input.type === "password";
                    input.type =
                        isPassword
                            ? "text"
                            : "password";
                    button.textContent =
                        isPassword
                            ? "Hide"
                            : "Show";
                    button.setAttribute(
                        "aria-label",
                        isPassword
                            ? "Hide password"
                            : "Show password"
                    );
                }
            );
        }
        setupPasswordToggle(
            "password",
            "passwordToggle"
        );
        setupPasswordToggle(
            "confirmPassword",
            "confirmPasswordToggle"
        );
    </script>
</body>
</html>
