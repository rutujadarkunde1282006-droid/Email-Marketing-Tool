<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campaigns - Email Marketing Tool</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #0A0E1A;
            color: #F5F7FA;
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .dashboard-header {
            width: 100%;
            background: rgba(10, 14, 26, 0.86);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1D2338;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dashboard-header-inner {
            width: min(1180px, calc(100% - 40px));
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .dashboard-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: #EDF0F7;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .dashboard-brand-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: #171D33;
            border: 1px solid #262D45;
            color: #F5A623;
            font-size: 19px;
        }

        .dashboard-nav {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .dashboard-nav a {
            padding: 9px 12px;
            border-radius: 8px;
            color: #8D96AE;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .dashboard-nav a:hover {
            background: #171D33;
            color: #EDF0F7;
        }

        .dashboard-nav a.active {
            background: #171D33;
            color: #F5A623;
        }

        .logout-button {
            margin-left: 5px;
            padding: 9px 14px;
            border: 1px solid #262D45;
            border-radius: 8px;
            background: transparent;
            color: #F87171;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .logout-button:hover {
            background: rgba(248, 113, 113, 0.10);
            border-color: rgba(248, 113, 113, 0.35);
        }

        .container {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #8F98AC;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #12172A;
            border: 1px solid #252B40;
            border-radius: 12px;
            padding: 20px;
        }

        .stat-card span {
            display: block;
            color: #8F98AC;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .stat-card strong {
            font-size: 27px;
        }

        .section {
            background: #12172A;
            border: 1px solid #252B40;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #DDE2EC;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: #0A0E1A;
            color: #F5F7FA;
            border: 1px solid #30374D;
            border-radius: 8px;
            padding: 12px 13px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #F5A623;
        }

        textarea {
            min-height: 170px;
            resize: vertical;
        }

        .contacts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .selected-count {
            color: #F5A623;
            font-size: 13px;
            font-weight: 600;
        }

        .contacts-list {
            max-height: 330px;
            overflow-y: auto;
            border: 1px solid #30374D;
            border-radius: 9px;
        }

        .contact-item {
            border-bottom: 1px solid #252B40;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px;
            margin: 0;
            cursor: pointer;
        }

        .contact-row input {
            width: auto;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .contact-info strong {
            font-size: 14px;
        }

        .contact-info span {
            color: #8F98AC;
            font-size: 12px;
        }

        .contact-status {
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 20px;
            text-transform: capitalize;
        }

        .contact-status.active {
            background: rgba(34, 197, 94, 0.12);
            color: #4ADE80;
        }

        .contact-status.inactive {
            background: rgba(239, 68, 68, 0.12);
            color: #F87171;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .primary-button,
        .secondary-button,
        .send-campaign-button,
        .delete-campaign-button {
            border-radius: 8px;
            padding: 11px 17px;
            font-weight: 600;
            border: none;
        }

        .primary-button,
        .send-campaign-button {
            background: #F5A623;
            color: #111827;
        }

        .primary-button:hover,
        .send-campaign-button:hover {
            background: #ffb83f;
        }

        .primary-button:disabled,
        .send-campaign-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-button {
            background: transparent;
            border: 1px solid #3A425B;
            color: #F5F7FA;
        }

        .secondary-button:hover {
            border-color: #F5A623;
            color: #F5A623;
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.12);
            color: #4ADE80;
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.12);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .campaigns-list {
            display: grid;
            gap: 16px;
        }

        .campaign-card {
            background: #0A0E1A;
            border: 1px solid #30374D;
            border-radius: 11px;
            padding: 18px;
        }

        .campaign-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 17px;
        }

        .campaign-card h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .campaign-card-header p {
            color: #8F98AC;
            font-size: 13px;
        }

        .campaign-status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .campaign-status.draft {
            background: rgba(245, 166, 35, 0.12);
            color: #F5A623;
        }

        .campaign-status.sent {
            background: rgba(34, 197, 94, 0.12);
            color: #4ADE80;
        }

        .campaign-status.failed {
            background: rgba(239, 68, 68, 0.12);
            color: #F87171;
        }

        .campaign-status.sending {
            background: rgba(59, 130, 246, 0.12);
            color: #60A5FA;
        }

        .campaign-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .campaign-details div {
            background: #12172A;
            border-radius: 7px;
            padding: 10px;
        }

        .campaign-details span {
            display: block;
            color: #8F98AC;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .campaign-details strong {
            font-size: 15px;
        }

        .campaign-date {
            color: #70798D;
            font-size: 11px;
            margin-bottom: 15px;
        }

        .campaign-actions {
            display: flex;
            gap: 9px;
        }

        .delete-campaign-button {
            background: transparent;
            border: 1px solid #4A3040;
            color: #F87171;
        }

        .delete-campaign-button:hover {
            border-color: #F87171;
        }

        .loading,
        .empty-state,
        .error {
            padding: 25px;
            text-align: center;
            color: #8F98AC;
            font-size: 13px;
        }

        .error {
            color: #F87171;
        }

        .preview {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #0A0E1A;
            border: 1px solid #30374D;
            border-radius: 9px;
        }

        .preview h4 {
            margin-bottom: 12px;
        }

        .preview-subject {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .preview-content {
            color: #B8C0D0;
            white-space: pre-wrap;
            line-height: 1.7;
        }

        @media (max-width: 850px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }

        @media (max-width: 950px) {
            .dashboard-header-inner {
                flex-direction: column;
                align-items: stretch;
                padding: 13px 0;
                gap: 10px;
            }

            .dashboard-brand {
                justify-content: center;
            }

            .dashboard-nav {
                justify-content: center;
            }
        }

        @media (max-width: 680px) {
            .dashboard-header-inner {
                width: min(100% - 24px, 1180px);
            }

            .dashboard-nav {
                gap: 2px;
            }

            .dashboard-nav a {
                padding: 8px 8px;
                font-size: 12px;
            }

            .logout-button {
                padding: 8px 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 420px) {
            .dashboard-brand {
                font-size: 16px;
            }

            .dashboard-brand-icon {
                width: 36px;
                height: 36px;
            }

            .dashboard-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                width: 100%;
            }

            .dashboard-nav a,
            .logout-button {
                width: 100%;
                text-align: center;
            }

            .logout-button {
                margin-left: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 24px, 1200px);
                padding-top: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .section {
                padding: 17px;
            }

            .campaign-details {
                grid-template-columns: 1fr 1fr;
            }

            .campaign-card-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="dashboard-header">

        <div class="dashboard-header-inner">

            <a
                href="dashboard.html"
                class="dashboard-brand"
            >
                <span
                    class="dashboard-brand-icon"
                    aria-hidden="true"
                >
                    ✉
                </span>

                <span>
                    Email Marketing Tool
                </span>
            </a>


            <nav
                class="dashboard-nav"
                aria-label="Dashboard navigation"
            >

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="templates.html">
                    Templates
                </a>

                <a href="contacts.html">
                    Customers
                </a>

                <a
                    href="campaigns.html"
                    class="active"
                >
                    Campaigns
                </a>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </nav>

        </div>

    </header>

    <main class="container">

        <!-- HEADER -->

        <div class="page-header">
            <h1>Campaigns</h1>

            <p>
                Create and send email campaigns to your customers.
            </p>
        </div>

        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>

        <!-- STATS -->

        <div class="stats-grid">

            <div class="stat-card">
                <span>Total Campaigns</span>
                <strong id="totalCampaigns">0</strong>
            </div>

            <div class="stat-card">
                <span>Sent</span>
                <strong id="sentCampaigns">0</strong>
            </div>

            <div class="stat-card">
                <span>Drafts</span>
                <strong id="draftCampaigns">0</strong>
            </div>

            <div class="stat-card">
                <span>Failed</span>
                <strong id="failedCampaigns">0</strong>
            </div>

        </div>

        <!-- CREATE CAMPAIGN -->

        <section class="section">

            <h2 class="section-title">
                Create Campaign
            </h2>

            <form id="campaignForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="campaignName">
                            Campaign Name
                        </label>

                        <input
                            type="text"
                            id="campaignName"
                            placeholder="Enter campaign name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="templateSelect">
                            Email Template
                        </label>

                        <select id="templateSelect">
                            <option value="">
                                Select email template
                            </option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="subject">
                            Email Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="Enter email subject"
                            required
                        >
                    </div>

                    <div class="form-group full">
                        <label for="content">
                            Email Content
                        </label>

                        <textarea
                            id="content"
                            placeholder="Write your email content here..."
                            required
                        ></textarea>
                    </div>

                    <div class="form-group full">

                        <div class="contacts-header">

                            <label>
                                Select Customers
                            </label>

                            <span
                                class="selected-count"
                            >
                                Selected:
                                <span id="selectedCount">0</span>
                            </span>

                        </div>

                        <div style="margin-bottom:10px;">
                            <label style="display:flex;align-items:center;gap:8px;">
                                <input
                                    type="checkbox"
                                    id="selectAll"
                                    style="width:auto;"
                                >

                                Select all active customers
                            </label>
                        </div>

                        <div
                            id="contactsList"
                            class="contacts-list"
                        >
                            <div class="loading">
                                Loading customers...
                            </div>
                        </div>

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="saveCampaignButton"
                        class="primary-button"
                    >
                        Save Campaign
                    </button>

                    <button
                        type="button"
                        id="previewCampaignButton"
                        class="secondary-button"
                    >
                        Preview
                    </button>

                </div>

            </form>

            <!-- PREVIEW -->

            <div
                id="campaignPreview"
                class="preview"
            >
                <h4>Email Preview</h4>

                <div
                    id="previewSubject"
                    class="preview-subject"
                ></div>

                <div
                    id="previewContent"
                    class="preview-content"
                ></div>
            </div>

        </section>

        <!-- CAMPAIGN HISTORY -->

        <section class="section">

            <h2 class="section-title">
                Campaign History
            </h2>

            <div
                id="campaignsList"
                class="campaigns-list"
            >
                <div class="loading">
                    Loading campaigns...
                </div>
            </div>

        </section>

    </main>

    <script
        src="js/campaigns.js"
        defer
    ></script>

</body>
</html>
