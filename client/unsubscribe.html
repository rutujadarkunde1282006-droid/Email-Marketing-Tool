<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unsubscribe - Email Marketing Tool</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #EDF0F7;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(245, 166, 35, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(124, 143, 255, 0.10),
                    transparent 35%
                ),
                #0A0E1A;
        }

        .unsubscribe-container {
            width: 100%;
            max-width: 460px;
            padding: 40px 34px;
            border: 1px solid #262D45;
            border-radius: 18px;
            background: #12172A;
            text-align: center;
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #171D33;
            border: 1px solid #262D45;
            font-size: 26px;
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Space Grotesk", sans-serif;
            color: #F4F6FB;
            font-size: 24px;
            font-weight: 600;
        }

        p#message {
            margin: 0;
            color: #8D96AE;
            font-size: 14px;
            line-height: 1.6;
        }

        p#message.success {
            color: #34D399;
            font-weight: 600;
        }

        p#message.error {
            color: #F87171;
            font-weight: 600;
        }

        .back-button {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 24px;
            border-radius: 10px;
            background: #F5A623;
            color: #0A0E1A;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .back-button:hover {
            background: #FFB847;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .unsubscribe-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="unsubscribe-container">

        <div class="icon" aria-hidden="true">📧</div>

        <h1 id="title">Unsubscribe</h1>

        <p id="message">
            Processing your unsubscribe request...
        </p>

        <a href="/" class="back-button">
            Back to Website
        </a>

    </main>

    <script>

        // Get contact ID from URL
        const params = new URLSearchParams(window.location.search);
        const contactId = params.get("contact");

        async function unsubscribe() {

            const message = document.getElementById("message");
            const title = document.getElementById("title");

            // Check contact ID
            if (!contactId) {
                title.textContent = "Invalid Request";
                message.textContent = "The unsubscribe link is invalid.";
                message.className = "error";
                return;
            }

            try {

                const response = await fetch(
                    `/api/contacts/${contactId}/unsubscribe-public`,
                    { method: "PUT" }
                );

                const data = await response.json();

                if (!response.ok) {
                    title.textContent = "Unable to Unsubscribe";
                    message.textContent = data.message || "Something went wrong.";
                    message.className = "error";
                    return;
                }

                title.textContent = "Unsubscribed Successfully";
                message.textContent = "You have been successfully unsubscribed. You will no longer receive marketing emails from us.";
                message.className = "success";

            } catch (error) {
                console.error(error);
                title.textContent = "Connection Error";
                message.textContent = "Unable to connect to the server. Please try again later.";
                message.className = "error";
            }
        }

        unsubscribe();

    </script>

</body>
</html>
