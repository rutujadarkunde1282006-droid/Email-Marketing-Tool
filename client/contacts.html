<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Email Marketing Tool</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           CUSTOMERS PAGE — DARK
        ========================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0A0E1A;
            color: #EDF0F7;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: "Space Grotesk", "Inter", sans-serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

/* ==========================================
   HEADER
========================================== */

.dashboard-header {
    width: 100%;
    background: rgba(10, 14, 26, 0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #1D2338;
    position: sticky;
    top: 0;
    z-index: 100;
}

.dashboard-header-inner {
    width: min(1180px, calc(100% - 40px));
    min-height: 72px;
    margin: 0 auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 25px;
}

/* BRAND */

.dashboard-brand {
    display: flex;
    align-items: center;
    gap: 11px;

    color: #EDF0F7;

    text-decoration: none;

    font-size: 18px;
    font-weight: 600;

    white-space: nowrap;
}

.dashboard-brand-icon {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: #171D33;
    border: 1px solid #262D45;

    color: #F5A623;

    font-size: 19px;
}

/* NAVIGATION */

.dashboard-nav {
    display: flex;
    align-items: center;

    gap: 5px;

    flex-wrap: wrap;
    justify-content: flex-end;
}

.dashboard-nav a {
    padding: 9px 12px;

    border-radius: 8px;

    color: #8D96AE;

    font-size: 13px;
    font-weight: 500;

    text-decoration: none;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.dashboard-nav a:hover {
    background: #171D33;
    color: #EDF0F7;
}

.dashboard-nav a.active {
    background: #171D33;
    color: #F5A623;
}

.logout-button {
    margin-left: 5px;

    padding: 9px 14px;

    border: 1px solid #262D45;
    border-radius: 8px;

    background: transparent;

    color: #F87171;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

.logout-button:hover {
    background: rgba(248, 113, 113, 0.10);
    border-color: rgba(248, 113, 113, 0.35);
}
        /* ==========================================
           MAIN
        ========================================== */

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 35px 32px 60px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            color: #F4F6FB;
            margin-bottom: 7px;
            letter-spacing: -0.7px;
        }

        .page-header p {
            color: #8D96AE;
            font-size: 14px;
        }

        /* ==========================================
           CARDS
        ========================================== */

        .card {
            background: #12172A;
            border: 1px solid #262D45;
            border-radius: 15px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: none;
        }

        .card-title {
            font-size: 19px;
            font-weight: 600;
            color: #F4F6FB;
            margin-bottom: 18px;
        }

        /* ==========================================
           FORMS
        ========================================== */

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 650;
            color: #C7CEDE;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            border: 1px solid #262D45;
            border-radius: 9px;
            padding: 0 13px;
            font-size: 14px;
            background: #0D1220;
            color: #EDF0F7;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .form-group input::placeholder {
            color: #5C637A;
        }

        .form-group input:focus {
            border-color: #F5A623;
            background: #171D33;
        }

        .primary-btn {
            height: 44px;
            border: none;
            border-radius: 9px;
            background: #F5A623;
            color: #0A0E1A;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .primary-btn:hover:not(:disabled) {
            background: #FFB847;
            transform: translateY(-1px);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ==========================================
           IMPORT
        ========================================== */

        .import-info {
            color: #8D96AE;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .import-info strong {
            color: #EDF0F7;
        }

        .import-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .file-input {
            height: 44px;
            padding: 9px 12px;
            border: 1px solid #262D45;
            border-radius: 9px;
            background: #0D1220;
            color: #C7CEDE;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .file-input:focus {
            border-color: #F5A623;
            outline: none;
        }

        /* ==========================================
           MESSAGE
        ========================================== */

        #message {
            display: none;
            padding: 13px 15px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 650;
            border: 1px solid;
        }

        #message.success {
            display: block;
            background: rgba(52, 211, 153, 0.12);
            color: #34D399;
            border-color: rgba(52, 211, 153, 0.25);
        }

        #message.error {
            display: block;
            background: rgba(248, 113, 113, 0.12);
            color: #F87171;
            border-color: rgba(248, 113, 113, 0.25);
        }

        #message.info {
            display: block;
            background: rgba(124, 143, 255, 0.12);
            color: #7C8FFF;
            border-color: rgba(124, 143, 255, 0.25);
        }

        /* ==========================================
           CUSTOMER TABLE
        ========================================== */

        .customers-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-box {
            width: 280px;
            height: 42px;
            border: 1px solid #262D45;
            border-radius: 9px;
            padding: 0 13px;
            outline: none;
            font-size: 14px;
            background: #0D1220;
            color: #EDF0F7;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .search-box::placeholder {
            color: #5C637A;
        }

        .search-box:focus {
            border-color: #F5A623;
            background: #171D33;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        thead {
            background: #0D1220;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            color: #8D96AE;
            font-size: 11px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #262D45;
        }

        td {
            padding: 16px;
            font-size: 13px;
            color: #C7CEDE;
            border-bottom: 1px solid #1D2338;
        }

        tbody tr:hover {
            background: #171D33;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status.active {
            background: rgba(52, 211, 153, 0.12);
            color: #34D399;
        }

        .status.unsubscribed {
            background: rgba(248, 113, 113, 0.12);
            color: #F87171;
        }

        .status.inactive {
            background: #1D2338;
            color: #8D96AE;
        }

        .status.bounced {
            background: rgba(245, 166, 35, 0.12);
            color: #FFB847;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .edit-btn {
            background: transparent;
            color: #7C8FFF;
            border-color: #7C8FFF;
        }

        .edit-btn:hover {
            background: rgba(124, 143, 255, 0.08);
            border-color: rgba(124, 143, 255, 0.5);
        }

        .unsubscribe-btn {
            background: transparent;
            color: #F5A623;
            border-color: #F5A623;
        }

        .unsubscribe-btn:hover {
            background: rgba(245, 166, 35, 0.08);
            border-color: rgba(245, 166, 35, 0.5);
        }

        .delete-btn {
            background: transparent;
            color: #F87171;
            border-color: #F87171;
        }

        .delete-btn:hover {
            background: rgba(248, 113, 113, 0.08);
            border-color: rgba(248, 113, 113, 0.5);
        }

        .empty-row {
            text-align: center;
            color: #5C637A;
            padding: 45px 20px;
        }

        .loading-row {
            text-align: center;
            color: #8D96AE;
            padding: 35px 20px;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 950px) {
            .dashboard-header-inner {
                flex-direction: column;
                align-items: stretch;
                padding: 13px 0;
                gap: 10px;
            }

            .dashboard-brand {
                justify-content: center;
            }

            .dashboard-nav {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .primary-btn {
                width: 100%;
            }
        }

        @media (max-width: 680px) {
            .dashboard-header-inner {
                width: min(100% - 24px, 1180px);
            }

            .dashboard-nav {
                gap: 2px;
            }

            .dashboard-nav a {
                padding: 8px 8px;
                font-size: 12px;
            }

            .logout-button {
                padding: 8px 10px;
                font-size: 12px;
            }

            main {
                padding: 25px 15px 40px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .search-box {
                width: 100%;
            }

            .customers-header {
                align-items: stretch;
            }

            .card {
                padding: 18px;
            }
        }

        @media (max-width: 420px) {
            .dashboard-brand {
                font-size: 16px;
            }

            .dashboard-brand-icon {
                width: 36px;
                height: 36px;
            }

            .dashboard-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                width: 100%;
            }

            .dashboard-nav a,
            .logout-button {
                width: 100%;
                text-align: center;
            }

            .logout-button {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="dashboard-header">

    <div class="dashboard-header-inner">

        <a
            href="dashboard.html"
            class="dashboard-brand"
        >
            <span
                class="dashboard-brand-icon"
                aria-hidden="true"
            >
                ✉
            </span>

            <span>
                Email Marketing Tool
            </span>
        </a>

        <nav
            class="dashboard-nav"
            aria-label="Dashboard navigation"
        >

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="templates.html">
                Templates
            </a>

            <a
                href="contacts.html"
                class="active"
            >
                Customers
            </a>

            <a href="campaigns.html">
                Campaigns
            </a>

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </nav>

    </div>

</header>

    <!-- ==========================================
         MAIN
    ========================================== -->

    <main>

        <div class="page-header">
            <h1>Customers</h1>
            <p>Add, manage, import and unsubscribe your email customers.</p>
        </div>

        <!-- MESSAGE -->
        <div id="message"></div>

        <!-- ==========================================
             ADD CUSTOMER
        ========================================== -->

        <section class="card">

            <div class="card-title">
                Add Customer
            </div>

            <form id="contactForm">

                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Customer Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter customer name"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="customer@example.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <button type="submit" class="primary-btn" id="addContactButton">
                        Add Customer
                    </button>

                </div>

            </form>

        </section>

        <!-- ==========================================
             IMPORT CUSTOMERS
        ========================================== -->

        <section class="card">

            <div class="card-title">
                Import Customers
            </div>

            <p class="import-info">
                Upload a CSV file containing <strong>name,email</strong> columns.
            </p>

            <form id="importForm">

                <div class="import-row">

                    <input
                        type="file"
                        id="csvFile"
                        name="csvFile"
                        class="file-input"
                        accept=".csv,text/csv"
                    >

                    <button type="submit" class="primary-btn" id="importButton">
                        Import CSV
                    </button>

                </div>

            </form>

        </section>

        <!-- ==========================================
             CUSTOMER LIST
        ========================================== -->

        <section class="card">

            <div class="customers-header">

                <div class="card-title" style="margin-bottom: 0;">
                    Customer List
                </div>

                <input
                    type="search"
                    id="search"
                    class="search-box"
                    placeholder="Search customers..."
                    autocomplete="off"
                >

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="contactsTable">
                        <tr>
                            <td colspan="5" class="loading-row">
                                Loading customers...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- IMPORTANT:
         There is NO inline customer JavaScript here.
         All customer functionality is handled by contacts.js.
    -->

    <script src="/js/contacts.js"></script>

</body>
</html>
